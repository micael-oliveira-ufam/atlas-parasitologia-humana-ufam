# Gera o APK do app Flutter. NÃO foi executado pelo autor (sem acesso ao GitHub/Flutter no ambiente de criação):
# na primeira execução, confira a versão do Flutter e os logs.
name: android-apk
on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Sincronizar assets do site (reprodutível; grava manifest.json)
        run: python3 tool/sync_assets.py
      - name: Gerar APK (analyze + testes + release)
        run: tool/build_apk.sh
      - name: Hashes
        run: cd build/app/outputs/flutter-apk && sha256sum *.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-parasitologia-apk
          path: |
            flutter_app/build/app/outputs/flutter-apk/*.apk
            flutter_app/build/app/outputs/flutter-apk/SHA256SUMS.txt
