# Servidor estático do Atlas (imagem nginxinc/nginx-unprivileged: porta 8080, usuário não-root).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;          # redirecionamentos relativos (funciona atrás de proxy/porta mapeada)

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types application/json text/css text/javascript application/javascript image/svg+xml;

    include /etc/nginx/atlas-headers.conf;

    # Verificação de saúde (usada pelo HEALTHCHECK do Docker)
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/atlas-headers.conf;
        return 200 "ok\n";
    }

    # Nunca servir arquivos ocultos nem o arquivo de cabeçalhos do Cloudflare Pages
    location ~ /\. { return 404; }
    location = /_headers { return 404; }

    # Dados: sempre revalidar (edições nos JSON aparecem sem esperar cache)
    location /data/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/atlas-headers.conf;
        try_files $uri =404;
    }

    # Imagens: cache de 1 h com revalidação por ETag (permite trocar uma foto mantendo o mesmo nome)
    location /assets/img/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        include /etc/nginx/atlas-headers.conf;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/atlas-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/atlas-headers.conf;
        try_files $uri $uri/ =404;
    }
}
